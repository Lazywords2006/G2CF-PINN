# E1: Burgers方程基准测试配置
# G2CF-PINN 实验设计

experiment:
  name: "E1_Burgers_Benchmark"
  description: "1D Burgers equation benchmark test"
  seed: 42
  
equation:
  type: "burgers_1d"
  nu: 0.0318  # 0.01/π
  domain:
    x: [-1, 1]
    t: [0, 1]
  ic: "u(x,0) = -sin(πx)"
  bc: "u(-1,t) = u(1,t) = 0"
  
training:
  points:
    N_f: 10000    # 域内配点
    N_b: 100      # 边界条件点
    N_0: 100      # 初始条件点
  optimizer: "adam"
  lr: 0.001
  epochs: 10000
  batch_size: null  # 全量训练
  
model:
  name: "G2CF_PINN"
  input_dim: 2
  num_features: 256
  sigma: 1.0
  causal_threshold: 0.05
  sampling_temperature: 2.0
  w_pde: 1.0
  w_ic: 10.0
  w_bc: 10.0
  
evaluation:
  metrics:
    - "L2_error"
    - "Linf_error"
    - "shock_error"
    - "training_time"
    - "iterations"
  test_points: 10000
  seeds: [42, 123, 456, 789, 1024]
  
comparison_methods:
  - name: "Standard_PINN"
    description: "Baseline PINN without enhancements"
    config:
      use_fourier: false
      use_causal: false
      use_adaptive_sampling: false
      
  - name: "PINN_FF"
    description: "PINN with Fourier Features only"
    config:
      use_fourier: true
      use_causal: false
      use_adaptive_sampling: false
      
  - name: "PINN_Causal"
    description: "PINN with Causal Training only"
    config:
      use_fourier: false
      use_causal: true
      use_adaptive_sampling: false
      
  - name: "PINN_AS"
    description: "PINN with Adaptive Sampling only"
    config:
      use_fourier: false
      use_causal: false
      use_adaptive_sampling: true
      
  - name: "G2CF_PINN"
    description: "Full G2CF-PINN method"
    config:
      use_fourier: true
      use_causal: true
      use_adaptive_sampling: true

output:
  save_model: true
  save_history: true
  save_figures: true
  figure_format: "png"
  figure_dpi: 300
