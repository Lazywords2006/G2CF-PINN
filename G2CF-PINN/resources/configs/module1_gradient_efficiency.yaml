# 模块1: 解析梯度效率验证
# 继承自 default.yaml，覆盖特定参数

inherit: default.yaml

experiment:
  name: module1_gradient_efficiency
  description: 验证解析梯度相比autodiff的效率优势

# 参数网格搜索
grid:
  fourier_features.m: [128, 256, 512]
  mlp.layers: [2, 3]
  batch_size: [1000, 5000, 10000]
  seed: [42, 43, 44]  # 3个随机种子

# 方法对比
methods:
  - name: standard_pinn
    description: 标准PINN (autodiff)
    model.type: standard_pinn
    gradient_sampling.strategy: uniform
    
  - name: fastlsq
    description: FastLSQ (解析导数，one-shot)
    model.type: fastlsq
    training.max_epochs: 1
    
  - name: g2cf_pinn
    description: G2CF-PINN (解析导数，迭代训练)
    model.type: g2cf_pinn
    causal.enabled: false
    gradient_sampling.enabled: false

# 评估指标
eval:
  metrics:
    - single_gradient_time_ms  # 单次梯度计算时间
    - total_training_time_min  # 总训练时间
    - memory_usage_mb  # 内存占用
    - relative_l2_error

# 成功标准
success_criteria:
  speedup_over_standard: 10.0  # G2CF比标准PINN快10x+

# 输出
output:
  table: Table_1
  figure: Figure_3
