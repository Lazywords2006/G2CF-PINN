# 模块6: 频率矩阵敏感性分析 (附录)
# 继承自 default.yaml，覆盖特定参数

inherit: default.yaml

experiment:
  name: module6_frequency_sensitivity
  description: 证明方法对频率矩阵B不敏感

# 参数网格搜索
grid:
  fourier_features.m: [128, 256, 512]
  fourier_features.sigma: [1.0, 10.0, 100.0]  # 频率范围
  seed: [42, 43, 44, 45, 46]  # 5组不同B

# 方法对比
methods:
  - name: random_B
    description: 随机B (不同种子)
    model.type: g2cf_pinn
    fourier_features.learnable_B: false
    
  - name: learnable_B
    description: 可学习B
    model.type: g2cf_pinn
    fourier_features.learnable_B: true
    
  - name: multiscale_B
    description: 多尺度B
    model.type: g2cf_pinn_multiscale

# 评估指标
eval:
  metrics:
    - relative_l2_error
    - training_stability

# 成功标准
success_criteria:
  performance_variation: 0.10  # 性能波动<10%

# 输出
output:
  table: Table_A1
