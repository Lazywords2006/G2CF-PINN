# G2CF-PINN 统一配置文件
# 使用方法: python train.py --config configs/default.yaml

# ============================================================
# 基础设置
# ============================================================
project: G2CF-PINN
seed: 42  # 基础随机种子，实验时会自动加 offset
device: auto  # auto, cuda, mps, cpu
output_dir: ./results

# ============================================================
# 问题定义
# ============================================================
equation:
  name: burgers  # burgers, allen_cahn, euler_sod, heat_2d, poisson_2d
  nu: 0.01  # Burgers粘性系数 (nu/pi)
  domain:
    x_min: -1.0
    x_max: 1.0
    t_min: 0.0
    t_max: 1.0

# ============================================================
# 模型架构
# ============================================================
model:
  type: g2cf_pinn  # standard_pinn, g2cf_pinn
  fourier_features:
    enabled: true
    m: 256  # 傅里叶特征维度: 128, 256, 512
    sigma: 10.0  # 频率缩放因子
    learnable_B: false  # 是否学习频率矩阵
  mlp:
    layers: 3  # 隐藏层数: 2, 3
    hidden_dim: 256
    activation: tanh
    skip_connections: true

# ============================================================
# 训练策略
# ============================================================
training:
  optimizer: adam
  lr: 1e-3
  lr_scheduler:
    type: cosine  # cosine, step, none
    T_max: 10000
    eta_min: 1e-6
  max_epochs: 10000
  batch_size: 1000  # 配点数: 1000, 5000, 10000
  early_stopping:
    enabled: true
    patience: 100
    min_delta: 1e-6

# ============================================================
# 因果训练 (Causal Training)
# ============================================================
causal:
  enabled: true
  mode: soft  # soft, hard
  time_steps: 20  # 时间步划分: 10, 20, 50
  threshold:
    type: adaptive  # fixed, adaptive
    initial: 0.1
    adapt_rate: 0.99

# ============================================================
# 梯度引导采样 (Gradient-Guided Sampling)
# ============================================================
gradient_sampling:
  enabled: true
  strategy: analytical  # analytical, residual, uniform
  temperature: 2.0  # 温度参数: 1.0, 2.0, 3.0
  update_freq: 500  # 采样更新频率: 100, 500, 1000
  top_k_ratio: 0.5  # 保留top-k比例的采样点

# ============================================================
# 损失函数权重
# ============================================================
loss:
  pde_weight: 1.0
  bc_weight: 10.0
  ic_weight: 10.0
  data_weight: 0.0  # 无数据时为0
  adaptive_weights: false

# ============================================================
# 评估设置
# ============================================================
eval:
  frequency: 100  # 每N个epoch评估一次
  metrics:
    - relative_l2_error
    - shock_position_error
    - causal_consistency
  reference_solution:
    method: finite_diff  # finite_diff, spectral
    grid_size: 256

# ============================================================
# 日志与可视化
# ============================================================
logging:
  wandb:
    enabled: true
    project: G2CF-PINN
    tags: []
  print_freq: 100
  save_checkpoint: true
  checkpoint_freq: 1000

visualization:
  plot_freq: 1000
  save_figures: true
  figure_format: png  # png, pdf, svg
