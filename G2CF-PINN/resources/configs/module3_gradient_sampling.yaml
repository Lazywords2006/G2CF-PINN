# 模块3: 梯度引导采样效果验证
# 继承自 default.yaml，覆盖特定参数

inherit: default.yaml

experiment:
  name: module3_gradient_sampling
  description: 验证梯度引导采样能提升激波捕捉效率

# 参数网格搜索
grid:
  batch_size: [1000, 2000, 5000]
  gradient_sampling.temperature: [1.0, 2.0, 3.0]
  gradient_sampling.update_freq: [100, 500, 1000]
  seed: [42, 43, 44]  # 3个随机种子

# 方法对比
methods:
  - name: uniform_sampling
    description: 均匀采样 (baseline)
    model.type: standard_pinn
    causal.enabled: false
    gradient_sampling.enabled: false
    
  - name: rad_rar_d
    description: RAD/RAR-D (残差自适应)
    model.type: standard_pinn
    causal.enabled: false
    gradient_sampling.strategy: residual
    
  - name: rl_pinns
    description: RL-PINNs (强化学习采样)
    model.type: rl_pinn
    causal.enabled: false
    
  - name: g2cf_pinn
    description: G2CF-PINN (解析梯度引导)
    model.type: g2cf_pinn
    causal.enabled: true
    gradient_sampling.enabled: true
    gradient_sampling.strategy: analytical

# 评估指标
eval:
  metrics:
    - sampling_efficiency  # 采样点利用率
    - points_for_target_error  # 达到目标误差所需点数
    - shock_region_density  # 激波区域采样密度
    - convergence_curve

# 成功标准
success_criteria:
  point_reduction: 0.50  # 采样点减少50%+

# 输出
output:
  table: Table_3
  figure: Figure_5
